<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Brawijaya Dashboard Eksekutif</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: sidebar arang tetap + area kerja terang; aksen tembaga khas Brawijaya; angka mono rata kanan */
:root{
  --bg:#F3F2F6; --surface:#FFFFFF; --surface-2:#F8F7FA; --line:#E2DFE8; --line-2:#EEECF2;
  --fg:#2A2730; --muted:#6D6E73; --faint:#A0A1A6;
  --char:#3B2A55; --char-2:#30224A; --char-3:#261B3B; --side-fg:#F3EFF8; --side-muted:#BBB1CC;
  --copper:#906DB1; --copper-strong:#6F4E93; --copper-soft:#ECE4F5; --copper-tint:#F7F3FB;
  --good:#2D7A57; --good-soft:#E3F2EA; --bad:#B93A2E; --bad-soft:#FBE7E4; --warn:#B27A08; --warn-soft:#FBF0D6; --info:#3B6E8F; --info-soft:#E3EEF5;
  --shadow:0 1px 2px rgba(42,39,48,.05),0 10px 30px rgba(59,42,85,.08);
  --f-ui:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16141B; --surface:#201D27; --surface-2:#1B1921; --line:#352F40; --line-2:#2A2632;
  --fg:#EEEBF2; --muted:#AAA7B0; --faint:#7F7B87;
  --char:#241C31; --char-2:#1E1729; --char-3:#181221; --side-fg:#EEEBF2; --side-muted:#A99FBA;
  --copper:#B597D6; --copper-strong:#CDB5E8; --copper-soft:#33284A; --copper-tint:#231D2C;
  --good:#5CC08F; --good-soft:#1C3328; --bad:#F07A6C; --bad-soft:#3A201D; --warn:#E5B54A; --warn-soft:#352B14; --info:#7DB3D6; --info-soft:#1C2C37;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16141B; --surface:#201D27; --surface-2:#1B1921; --line:#352F40; --line-2:#2A2632;
  --fg:#EEEBF2; --muted:#AAA7B0; --faint:#7F7B87;
  --char:#241C31; --char-2:#1E1729; --char-3:#181221; --side-fg:#EEEBF2; --side-muted:#A99FBA;
  --copper:#B597D6; --copper-strong:#CDB5E8; --copper-soft:#33284A; --copper-tint:#231D2C;
  --good:#5CC08F; --good-soft:#1C3328; --bad:#F07A6C; --bad-soft:#3A201D; --warn:#E5B54A; --warn-soft:#352B14; --info:#7DB3D6; --info-soft:#1C2C37;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
#root{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;line-height:1.25;text-wrap:balance;letter-spacing:-.01em}
a{color:var(--copper-strong)}
.num,.mono{font-family:var(--f-num);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--copper);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- boot / login ---------- */
.boot{min-height:100%;display:grid;place-items:center;padding-block:40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.auth{position:relative;min-height:100vh;min-height:100dvh;overflow:hidden;color:#fff;background:radial-gradient(ellipse at 50% -10%,#A889C9 0%,rgba(168,137,201,0) 55%),linear-gradient(160deg,#2A1D40 0%,#45306A 45%,#6E4E95 100%);display:flex;justify-content:center;align-items:center;padding-block:clamp(24px,5vh,56px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.auth-deco{position:absolute;inset:0;pointer-events:none}
.auth-deco .wm{position:absolute;width:min(46vw,520px);opacity:.07;filter:brightness(0) invert(1)}
.auth-deco .wm.l{left:-8%;bottom:-12%}
.auth-deco .wm.r{right:-10%;top:-14%;transform:rotate(180deg)}
.auth-deco .ring{position:absolute;border-radius:50%;border:1px solid rgba(255,255,255,.12)}
.auth-wrap{position:relative;z-index:1;width:100%;max-width:960px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(20px,3.5vh,32px)}
.auth-head{text-align:center;display:grid;gap:12px;justify-items:center}
.auth-head .eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:#E4D8F2;font-weight:700}
.auth-head .eyebrow::before,.auth-head .eyebrow::after{content:"";width:28px;height:1px;background:rgba(228,216,242,.55)}
.auth-head h1{font-size:clamp(24px,3.4vw,38px);font-weight:800;line-height:1.18;letter-spacing:-.02em;max-width:24ch;text-wrap:balance}
.auth-head p{margin:0;color:#E6DDF1;font-size:clamp(13.5px,1.2vw,15.5px);line-height:1.6;max-width:58ch;text-wrap:pretty}
.auth-card{width:100%;max-width:420px;background:var(--surface);color:var(--fg);border-radius:20px;box-shadow:0 30px 80px rgba(20,10,40,.45),0 2px 6px rgba(20,10,40,.2);padding:clamp(24px,4vw,36px);display:flex;flex-direction:column;gap:15px}
.auth-logo{height:52px;width:auto;max-width:100%;object-fit:contain}
.auth-logo-wrap{padding-bottom:18px;border-bottom:1px solid var(--line-2);display:flex;justify-content:center}
:root[data-theme="dark"] .auth-logo{background:#fff;border-radius:10px;padding:8px 12px;height:62px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .auth-logo{background:#fff;border-radius:10px;padding:8px 12px;height:62px}}
.auth-card h2{font-size:21px;font-weight:800;text-align:center}
.auth-card .sub{margin:4px 0 0;color:var(--muted);font-size:13px;text-align:center}
.inp-ic{position:relative}
.inp-ic svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none}
.inp-ic .inp{padding:11px 12px 11px 38px;border-radius:10px;background:var(--surface-2)}
.inp-ic .inp:focus{background:var(--surface)}
.auth-card .btn.pri{justify-content:center;padding:12px;border-radius:10px;font-size:14px}
.auth-meta{display:grid;gap:4px;text-align:center;font-size:12px;color:var(--faint)}
.auth-feats{list-style:none;margin:0;padding:0;width:100%;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.auth-feats li{display:grid;gap:8px;justify-items:center;text-align:center;font-size:12.5px;line-height:1.45;color:#EDE6F6;padding:14px 12px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12)}
.auth-feats li b{font-size:13px;color:#fff}
.auth-feats .i{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.14);display:grid;place-items:center}
.auth-foot{font-size:11.5px;color:#CBBEDD;text-align:center}
@media (max-width:860px){.auth-feats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.auth-head p{display:none}.auth-head .eyebrow::before,.auth-head .eyebrow::after{display:none}}
#lg-err:empty{display:none}
.brand{display:flex;align-items:center;gap:12px}
.brand-mark{width:42px;height:42px;border-radius:11px;background:#fff;display:grid;place-items:center;flex:none;overflow:hidden;padding:5px}
.brand-mark img{width:100%;height:100%;object-fit:contain}
.brand-name{font-weight:800;font-size:16px;letter-spacing:.01em}
.brand-sub{font-size:10.5px;color:var(--side-muted);text-transform:uppercase;letter-spacing:.14em}

/* ---------- app shell ---------- */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100%}
.side{background:linear-gradient(180deg,var(--char) 0%,var(--char-3) 100%);color:var(--side-fg);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto;padding:18px 12px;gap:6px}
.side .brand{padding:4px 8px 16px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:8px}
.nav-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.14em;color:var(--side-muted);padding:14px 10px 4px}
.nav-btn{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;color:var(--side-fg);padding:9px 10px;border-radius:8px;cursor:pointer;text-align:left;font-weight:500;font-size:13.5px}
.nav-btn:hover{background:rgba(255,255,255,.06)}
.nav-btn.on{background:#906DB1;color:#fff;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.nav-btn svg{flex:none;opacity:.9}
.nav-sub{display:grid;gap:1px;padding-left:26px;margin:2px 0 4px}
.nav-sub .nav-btn{padding:6px 10px;font-size:13px;color:var(--side-muted)}
.nav-sub .nav-btn.on{background:rgba(181,151,214,.2);color:#E6DAF5;font-weight:600}
.side-foot{margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,.08);font-size:12px;color:var(--side-muted);display:grid;gap:6px}
.store-pill{display:inline-flex;gap:6px;align-items:center;font-size:11.5px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block}
.dot.local{background:var(--warn)}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:12px;flex-wrap:wrap}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.topbar h1{font-size:18px;font-weight:800}
.topbar .crumb{font-size:12px;color:var(--muted)}
.topbar .grow{flex:1}
.userchip{display:flex;align-items:center;gap:8px;padding:4px 10px 4px 4px;border:1px solid var(--line);border-radius:999px;font-size:12.5px}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--copper-soft);color:var(--copper-strong);display:grid;place-items:center;font-weight:800;font-size:12px}
.menu-toggle{display:none}
.tabs{display:flex;gap:4px;padding-top:10px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--surface-2);overflow-x:auto}
.tab{display:flex;align-items:center;gap:8px;border:1px solid transparent;border-bottom:0;background:transparent;padding:8px 12px;border-radius:8px 8px 0 0;cursor:pointer;font-size:13px;white-space:nowrap;color:var(--muted);font-weight:600}
.tab.on{background:var(--bg);border-color:var(--line);color:var(--fg);margin-bottom:-1px}
.tab .x{border:0;background:transparent;cursor:pointer;color:var(--faint);padding:0 2px;display:grid;place-items:center;border-radius:4px}
.tab .x:hover{color:var(--bad)}
.tab .badge-mini{width:7px;height:7px;border-radius:50%}
.content{padding-block:20px 48px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:grid;gap:18px;min-width:0}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:270px;z-index:60;transform:translateX(-102%);transition:transform .2s;padding-top:calc(18px + env(safe-area-inset-top,0px));padding-left:max(12px,env(safe-area-inset-left,0px))}
  .side.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.45)}
  .menu-toggle{display:inline-flex}
  .topbar .crumb{display:none}
}

/* ---------- elements ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.card-h h3{font-size:14.5px;font-weight:700}
.card-h .sub{font-size:12px;color:var(--muted)}
.card-h .grow{flex:1}
.card-b{padding:16px;min-width:0}
.grid{display:grid;gap:16px;min-width:0}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-7-5{grid-template-columns:minmax(0,7fr) minmax(0,5fr)}
@media (max-width:1100px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){.g2,.g3,.g-7-5{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);padding:8px 13px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap;line-height:1.2}
.btn:hover{border-color:var(--faint)}
.btn.pri{background:var(--copper-strong);border-color:var(--copper-strong);color:#fff}
.btn.pri:hover{background:var(--char);border-color:var(--char);color:#fff}
.btn.dark{background:var(--char);border-color:var(--char);color:var(--side-fg)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,var(--line))}
.btn.danger:hover{background:var(--bad);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:7px}
.btn.icon{padding:6px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.field{display:grid;gap:5px;min-width:0}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.field .req{color:var(--bad)}
.inp,select.inp,textarea.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-width:0}
textarea.inp{min-height:76px;resize:vertical}
.inp:focus{border-color:var(--copper);outline:none;box-shadow:0 0 0 3px var(--copper-soft)}
.hint{font-size:11.5px;color:var(--faint)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px 14px}
.form-grid .span2{grid-column:span 2}
.form-grid .full{grid-column:1/-1}
@media (max-width:520px){.form-grid .span2{grid-column:1/-1}}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.filters .field{min-width:140px;flex:1 1 140px;max-width:220px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:12px;cursor:pointer;font-weight:600;color:var(--muted)}
.chip.on{background:var(--copper-strong);color:#fff;border-color:var(--copper-strong)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.neutral{background:var(--line-2);color:var(--muted)}
.pill.copper{background:var(--copper-soft);color:var(--copper-strong)}
.pos{color:var(--good)} .neg{color:var(--bad)}

/* tables */
.tbl-wrap{overflow-x:auto;min-width:0}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap;position:sticky;top:0}
.tbl th.sortable{cursor:pointer}
.tbl th.sortable:hover{color:var(--fg)}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line-2);vertical-align:top}
.tbl td.r,.tbl th.r{text-align:right}
.tbl td.num{white-space:nowrap}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--copper-tint)}
.tbl tfoot td{font-weight:700;background:var(--surface-2);border-top:1px solid var(--line)}
.tbl .muted{color:var(--muted);font-size:12px}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-size:15px;margin-bottom:4px}
.pager{display:flex;align-items:center;gap:8px;justify-content:flex-end;padding:10px 12px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
@media (max-width:1280px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 12px;display:grid;gap:4px;min-width:0}
.kpi .k-l{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700}
.kpi .k-v{font-family:var(--f-num);font-size:clamp(16px,1.35vw,21px);font-weight:600;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .k-s{font-size:12px;color:var(--muted)}
.kpi.hl{background:linear-gradient(140deg,var(--char) 0%,#5A4182 100%);border-color:var(--char);color:var(--side-fg)}
.kpi.hl .k-l,.kpi.hl .k-s{color:var(--side-muted)}
.chart-box{position:relative;height:270px;min-width:0}
.chart-box.tall{height:340px}
.chart-box.short{height:220px}
.bar-mini{height:8px;border-radius:4px;background:var(--line-2);overflow:hidden;min-width:70px}
.bar-mini span{display:block;height:100%;border-radius:4px}
.insights{display:grid;gap:10px}
.insight{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line-2)}
.insight .ic{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;flex:none}
.insight p{margin:0;font-size:13px}
.heat td{text-align:right;font-family:var(--f-num);font-size:12px;white-space:nowrap}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(20,22,24,.5);z-index:100;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding-block:calc(24px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:640px;box-shadow:0 20px 60px rgba(0,0,0,.3);border:1px solid var(--line);display:flex;flex-direction:column;min-width:0;animation:pop .16s ease-out}
.modal.lg{max-width:980px}
.modal.sm{max-width:420px}
@keyframes pop{from{transform:translateY(8px);opacity:.6}to{transform:none;opacity:1}}
.modal-h{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-h h3{font-size:16px;font-weight:800;flex:1}
.modal-b{padding:18px 20px;display:grid;gap:16px;min-width:0}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line);background:var(--surface-2);border-radius:0 0 14px 14px;flex-wrap:wrap}
.sec-title{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--copper-strong);font-weight:800;display:flex;align-items:center;gap:8px}
.sec-title::after{content:"";flex:1;height:1px;background:var(--line)}
.toast-wrap{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;z-index:200}
.toast{background:var(--char);color:var(--side-fg);padding:10px 14px;border-radius:9px;font-size:13px;box-shadow:var(--shadow);display:flex;gap:8px;align-items:center;max-width:380px}
.toast.err{background:var(--bad);color:#fff}
.toast.ok svg{color:#CDB5E8}
.note{padding:10px 12px;border-radius:8px;font-size:12.5px;background:var(--info-soft);color:var(--fg);border:1px solid color-mix(in srgb,var(--info) 25%,transparent)}
.note.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.code{font-family:var(--f-num);font-size:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:12px;overflow:auto;max-height:340px;white-space:pre}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere}
.decomp{display:grid;gap:8px}
.decomp-row{display:grid;grid-template-columns:minmax(120px,1.3fr) minmax(0,2fr) auto;gap:10px;align-items:center;font-size:13px}
.decomp-track{height:12px;background:var(--line-2);border-radius:6px;position:relative;overflow:hidden}
.decomp-track span{position:absolute;top:0;bottom:0;border-radius:6px}
.cause{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:start;padding:10px 0;border-bottom:1px dashed var(--line)}
.cause:last-child{border-bottom:0}
.cause .n{width:26px;height:26px;border-radius:50%;background:var(--bad-soft);color:var(--bad);display:grid;place-items:center;font-weight:800;font-size:12px}
.cause .n.g{background:var(--good-soft);color:var(--good)}
.cause h4{font-size:13.5px}
.cause p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.hero-pt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;background:linear-gradient(135deg,var(--char) 0%,#5A4182 100%);color:var(--side-fg);border-radius:var(--r);padding:18px 20px}
.hero-pt h2{font-size:21px;font-weight:800}
.hero-pt .meta{display:flex;gap:6px 16px;flex-wrap:wrap;color:var(--side-muted);font-size:12.5px;margin-top:6px}
.hero-pt .big{font-family:var(--f-num);font-size:26px;font-weight:600;text-align:right}
@media (max-width:640px){.hero-pt{grid-template-columns:1fr}.hero-pt .big{text-align:left}}
.gauge{height:14px;background:rgba(255,255,255,.12);border-radius:7px;position:relative;margin-top:10px;overflow:hidden}
.gauge span{position:absolute;left:0;top:0;bottom:0;border-radius:7px}
.tut{display:grid;gap:10px}
.tut details{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.tut summary{padding:14px 16px;cursor:pointer;font-weight:700;display:flex;gap:12px;align-items:center;list-style:none}
.tut summary::-webkit-details-marker{display:none}
.tut summary .step{width:28px;height:28px;border-radius:8px;background:var(--copper-soft);color:var(--copper-strong);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.tut .tb{padding:0 16px 16px 56px;color:var(--fg);font-size:13.5px;max-width:80ch}
.tut .tb ol,.tut .tb ul{padding-left:18px;margin:6px 0}
.tut .tb li{margin:4px 0}
.drop{border:2px dashed var(--line);border-radius:10px;padding:26px;text-align:center;cursor:pointer;color:var(--muted);background:var(--surface-2)}
.drop:hover,.drop.over{border-color:var(--copper);background:var(--copper-tint);color:var(--fg)}
.map-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 14px;align-items:center}
.rs-card{padding:16px;display:grid;gap:10px}
.rs-card h3{font-size:15px}
.rs-stat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.rs-stat div{background:var(--surface-2);border-radius:8px;padding:8px 10px}
.rs-stat small{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.rs-stat b{font-family:var(--f-num);font-size:14px}
.loading{display:grid;place-items:center;min-height:60vh;color:var(--muted);gap:12px}
.spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--copper);border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.pwd-reveal{font-family:var(--f-num);font-size:20px;background:var(--copper-tint);border:1px dashed var(--copper);border-radius:8px;padding:12px;text-align:center;letter-spacing:.06em;user-select:all}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar .search{position:relative;flex:1 1 220px;max-width:340px}
.toolbar .search input{padding-left:32px}
.toolbar .search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--faint)}
.bill-tbl input{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:5px 7px;width:100%;min-width:0}
.bill-tbl td{padding:6px 6px}
.page-head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.page-head h2{font-size:20px;font-weight:800}
.page-head p{margin:2px 0 0;color:var(--muted);font-size:13px;max-width:70ch}
.page-head .grow{flex:1}
.topbar .menu-toggle{display:none}
@media (max-width:900px){.topbar .menu-toggle{display:inline-flex}}
.legend-dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
</style>
</head>

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const rpS=n=>{n=+n||0;const a=Math.abs(n),s=n<0?"−":"";if(a>=1e12)return s+"Rp "+(a/1e12).toFixed(2).replace(".",",")+" T";if(a>=1e9)return s+"Rp "+(a/1e9).toFixed(2).replace(".",",")+" M";if(a>=1e6)return s+"Rp "+(a/1e6).toFixed(1).replace(".",",")+" jt";return rp(n)};

function parseNum(v){if(typeof v==="number")return v;let s=String(v??"").replace(/rp\.?/i,"").replace(/\s/g,"").trim();if(!s)return 0;
  let neg=/^\(.*\)$/.test(s)||s.startsWith("-");s=s.replace(/[()\-]/g,"");
  if(/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(s))s=s.replace(/\./g,"").replace(",",".");
  else if(/^\d{1,3}(,\d{3})+(\.\d+)?$/.test(s))s=s.replace(/,/g,"");
  else s=s.replace(",",".");const n=parseFloat(s);return isNaN(n)?0:(neg?-n:n)}
function parseDate(v){if(v==null||v==="")return"";if(typeof v==="number"&&v>20000&&v<80000){const d=new Date(Math.round((v-25569)*864e5));return d.toISOString().slice(0,10)}
  if(v instanceof Date&&!isNaN(v))return v.toISOString().slice(0,10);
  const s=String(v).trim();let m;
  if((m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/)))return m[1]+"-"+m[2].padStart(2,"0")+"-"+m[3].padStart(2,"0");
  if((m=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/))){let y=m[3].length===2?"20"+m[3]:m[3];return y+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0")}
  const d=new Date(s);return isNaN(d)?"":d.toISOString().slice(0,10)}
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}};
function rnd(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
async function hashPwd(pwd,salt){const txt=salt+"::"+pwd;try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(txt));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){let h=5381;for(const c of txt)h=(h*33^c.charCodeAt(0))>>>0;return "f"+h.toString(16)}}
function genPwd(){const c="ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789";let s="";const r=new Uint32Array(10);try{crypto.getRandomValues(r)}catch(e){for(let i=0;i<10;i++)r[i]=Math.random()*1e9}for(let i=0;i<10;i++)s+=c[r[i]%c.length];return s.slice(0,4)+"-"+s.slice(4,8)+s.slice(8)}

/* ---------------- ENGINE: analisa pagu ---------------- */
function parseCP(str){const out=[];String(str||"").split(/[;\n]+/).forEach(seg=>{const m=seg.trim().match(/^([^:]+):\s*([\d.,]+)\s*(d?)\s*(?:@\s*([\d.,]+))?/i);if(m)out.push({kode:m[1].trim(),qty:parseNum(m[2]),perDay:!!m[3],harga:m[4]?parseNum(m[4]):0})});return out}
function buildPaguIndex(){const idx={};rows("pagu").forEach(r=>{const k=norm(r.icd10);(idx[k]=idx[k]||[]).push(r)});return idx}
function findPagu(p,idx){const c=idx[norm(p.icd10)];if(!c)return null;
  const score=r=>(r.hospitalId===p.hospitalId?4:r.hospitalId==="ALL"?2:-99)+(r.kelas===p.kelas?2:r.kelas==="Semua"?1:-1)+((r.jenis_rawat||"Rawat Inap")===(p.jenisRawat||"Rawat Inap")?1:0);
  const best=[...c].sort((a,b)=>score(b)-score(a))[0];return best&&score(best)>-50?best:null}
function losOf(p){const end=p.tglPulang||todayISO();return Math.max(1,daysBetween(p.tglMasuk,end)+(p.jenisRawat==="Rawat Jalan"?1:0))}
function analyze(p,idx){
  const items=(p.items||[]).map(it=>({...it,qty:+it.qty||0,harga:+it.harga||0,total:(+it.qty||0)*(+it.harga||0)}));
  const billing=sum(items,i=>i.total);const los=losOf(p);const pg=findPagu(p,idx);
  const cat={};KATEGORI.forEach(k=>cat[k]={actual:0,plafon:0,diff:0});
  items.forEach(i=>{const k=KATEGORI.includes(i.kategori)?i.kategori:"Penunjang";cat[k].actual+=i.total});
  const res={p,billing,los,items,cat,pagu:0,selisih:0,util:0,status:"nopagu",losStd:0,losDiff:0,dec:{price:0,qty:0,qtyLos:0,offcp:0,under:0,buffer:0,ref:0},lines:[],causes:[],paguRow:pg,ongoing:!p.tglPulang};
  if(!pg){return res}
  res.pagu=+pg.plafon_total||0;res.losStd=+pg.los_standar||0;res.losDiff=los-res.losStd;
  KATEGORI.forEach(k=>{cat[k].plafon=+pg[KAT_KEY(k)]||0;cat[k].diff=cat[k].plafon-cat[k].actual});
  res.selisih=res.pagu-billing;res.util=res.pagu?billing/res.pagu:0;
  res.status=res.selisih<0?"over":res.util>=0.9?"warn":"ok";
  // dekomposisi berbasis item CP
  const cp=parseCP(pg.item_cp);
  if(cp.length){
    const ref={};cp.forEach(c=>{const q=c.perDay?c.qty:c.qty;ref[c.kode]={...c,qtyStd:c.perDay?(res.losStd?c.qty:c.qty):c.qty}});
    const act={};items.forEach(i=>{const a=act[i.kode]||(act[i.kode]={kode:i.kode,nama:i.nama,kategori:i.kategori,qty:0,total:0});a.qty+=i.qty;a.total+=i.total});
    const codes=new Set([...Object.keys(ref),...Object.keys(act)]);
    codes.forEach(k=>{const r=ref[k],a=act[k];const qa=a?a.qty:0,pa=a&&a.qty?a.total/a.qty:(r?r.harga:0);const qr=r?r.qty:0,pr=r?r.harga||pa:0;
      const line={kode:k,nama:a?a.nama:(rows("tarif").find(t=>t.kode===k)?.nama||k),kategori:a?a.kategori:(rows("tarif").find(t=>t.kode===k)?.kategori||""),qa,qr,pa,pr,actual:a?a.total:0,refCost:qr*pr,perDay:r?r.perDay:false,price:0,qty:0,offcp:0};
      if(!r){line.offcp=line.actual;res.dec.offcp+=line.actual;line.type="Di luar CP"}
      else{line.price=qa>0?Math.min(qa,qr)*(pa-pr)+(qa>qr?0:0):0;
        // varians harga dihitung atas qty aktual yang masih dalam standar; kelebihan qty dinilai pada harga aktual
        line.price=(Math.min(qa,qr))*(pa-pr);line.qty=(qa-qr)*(qa>qr?pa:pr);
        res.dec.price+=line.price;if(r.perDay)res.dec.qtyLos+=line.qty;else res.dec.qty+=line.qty;
        line.type=qa===0?"Tidak diberikan":qa>qr?(r.perDay?"Lebih (LOS)":"Lebih qty"):qa<qr?"Kurang dari CP":"Sesuai CP"}
      res.dec.ref+=line.refCost;res.lines.push(line)});
    res.dec.buffer=res.pagu-res.dec.ref;
    res.lines.sort((a,b)=>(b.offcp+Math.max(0,b.qty)+Math.max(0,b.price))-(a.offcp+Math.max(0,a.qty)+Math.max(0,a.price)));
  }else{
    res.lines=Object.values(groupBy(items,i=>i.kode)).map(g=>({kode:g[0].kode,nama:g[0].nama,kategori:g[0].kategori,qa:sum(g,x=>x.qty),qr:0,pa:g[0].harga,pr:0,actual:sum(g,x=>x.total),refCost:0,price:0,qty:0,offcp:0,type:"Tanpa rincian CP"})).sort((a,b)=>b.actual-a.actual);
  }
  // penyebab (narasi)
  const C=[];
  if(res.losDiff>0){const perDayCost=res.dec.qtyLos>0?res.dec.qtyLos:(cat.Akomodasi.actual/los)*res.losDiff;C.push({k:"los",label:`LOS ${los} hari melebihi standar ${res.losStd} hari (+${res.losDiff} hari)`,amount:perDayCost,detail:"Biaya harian (kamar, visite, obat rutin) bertambah sesuai hari rawat tambahan."})}
  if(res.dec.offcp>0){const top=res.lines.filter(l=>l.offcp>0).slice(0,3).map(l=>l.nama).join(", ");C.push({k:"offcp",label:"Item di luar Clinical Pathway",amount:res.dec.offcp,detail:"Terbesar: "+top})}
  if(res.dec.qty>0){const top=res.lines.filter(l=>l.qty>0&&!l.perDay).slice(0,3).map(l=>`${l.nama} (${l.qa}× vs ${l.qr}×)`).join(", ");C.push({k:"qty",label:"Utilisasi melebihi standar CP",amount:res.dec.qty,detail:top})}
  if(res.dec.price>0)C.push({k:"price",label:"Tarif RS di atas harga acuan pagu",amount:res.dec.price,detail:"Selisih harga satuan tarif RS dibanding harga referensi CP korporat."});
  if(!cp.length)KATEGORI.forEach(k=>{if(cat[k].plafon&&cat[k].diff<0)C.push({k:"cat",label:`Kategori ${k} melebihi plafon`,amount:-cat[k].diff,detail:`${rp(cat[k].actual)} vs plafon ${rp(cat[k].plafon)}`})});
  C.sort((a,b)=>b.amount-a.amount);res.causes=C;return res}
function getAll(){if(CACHE)return CACHE;const idx=buildPaguIndex();const m={};DATA.patients.forEach(p=>m[p.id]=analyze(p,idx));CACHE=m;return m}

  return true}).map(p=>A[p.id])}

  const DEPAN=["Andi","Budi","Citra","Dewi","Eko","Fajar","Gita","Hendra","Indah","Joko","Kartika","Lukman","Maya","Nanda","Oki","Putri","Rizky","Sari","Teguh","Wulan","Yudha","Zahra","Arif","Bayu","Dian","Rina","Agus","Mega","Rudi","Tika"];

  mrows.dokter=[];const docBias={};
  hospitals.forEach((h,hi)=>{const sp=["Sp.PD","Sp.PD","Sp.P","Sp.N","Sp.JP","Sp.B","Sp.OG","Sp.OT","Sp.PD"];sp.forEach((s,i)=>{const kode=`D${hi+1}${String(i+1).padStart(2,"0")}`;mrows.dokter.push({id:uid("d"),kode,nama:`dr. ${pick(DEPAN)} ${pick(BLK)}, ${s}`,spesialis:s,hospitalId:h.id,sip:`SIP/${kode}/2025`,status:"Aktif"});docBias[h.id+kode]=R()<0.3?0.35+R()*0.35:R()*0.18})});
  mrows.tarif=[];hospitals.forEach(h=>TARIF_BASE.forEach(t=>mrows.tarif.push({id:uid("t"),kode:t[0],nama:t[1],kategori:t[2],kelas:t[3],harga:Math.round(t[4]*h.factor*(0.98+R()*0.04)/500)*500,hospitalId:h.id})));
  const base=Object.fromEntries(TARIF_BASE.map(t=>[t[0],t]));
  const akmCode={"VIP":"AKM-VIP","Kelas 1":"AKM-K1","Kelas 2":"AKM-K2","Kelas 3":"AKM-K3"};
  mrows.pagu=[];
  DX.forEach(d=>KELAS.forEach(k=>{const los=d[3];const list=[[akmCode[k],"d"],...d[5]];const catSum={};let tot=0;const cp=list.map(([kode,q])=>{const pd=q==="d";const qty=pd?los:q;const h=base[kode][4];const c=qty*h;tot+=c;catSum[base[kode][2]]=(catSum[base[kode][2]]||0)+c;return `${kode}:${qty}${pd?"d":""}@${h}`});
    const row={id:uid("g"),kode:`CP-${d[0]}-${k.replace("Kelas ","K")}`,icd10:d[0],nama_diagnosa:d[1],kelas:k,jenis_rawat:"Rawat Inap",los_standar:los,plafon_total:Math.round(tot*1.10/10000)*10000,item_cp:cp.join("; "),sumber:"Clinical Pathway",hospitalId:"ALL"};
    KATEGORI.forEach(c=>row[KAT_KEY(c)]=Math.round((catSum[c]||0)*1.10/1000)*1000);mrows.pagu.push(row)}));

  const patients=[];const today=new Date(todayISO()+"T00:00:00");const start=new Date(today);start.setMonth(start.getMonth()-4);start.setDate(1);
  const span=Math.round((today-start)/864e5);
  const pen=()=>{const r=R();return r<.55?"BPJS":r<.68?"UMUM":r<.76?"ADM":r<.84?"PRU":r<.9?"ALZ":r<.95?"INH":"CORP-A"};
  const kel=()=>{const r=R();return r<.35?"Kelas 3":r<.6?"Kelas 2":r<.85?"Kelas 1":"VIP"};
  for(let n=0;n<180;n++){
    const h=hospitals[n%5];const d=pick(DX);const docs=mrows.dokter.filter(x=>x.hospitalId===h.id&&x.spesialis===d[4]);const doc=pick(docs.length?docs:mrows.dokter.filter(x=>x.hospitalId===h.id));

    const icd9=[...new Set(items.map(i=>PROC9[i.kode]).filter(Boolean))];

    patients.push({id:uid("pt"),hospitalId:h.id,noReg:`${h.kode.slice(4)}${tglMasuk.replace(/-/g,"").slice(2)}${String(n).padStart(3,"0")}`,noRM:String(100000+Math.floor(R()*899999)),nama:`${pick(DEPAN)} ${pick(BLK)}`,jk,tglLahir:`${by}-${String(1+Math.floor(R()*12)).padStart(2,"0")}-${String(1+Math.floor(R()*27)).padStart(2,"0")}`,
      penjamin:pen(),kelas,jenisRawat:"Rawat Inap",tglMasuk,tglPulang,dpjp:doc.kode,icd10:d[0],icd10Sek:[],icd9,caraPulang:ongoing?"":"Pulang atas izin dokter",items,catatan:"",source:"contoh",createdAt:new Date().toISOString(),ts:Date.now()+n})}
  return{hospitals,mrows,patients}}

async function parseFile(file){
  const name=file.name.toLowerCase();const ext=name.split(".").pop();const tables=[];
  const fromAoA=(nm,aoa)=>{aoa=aoa.filter(r=>r&&r.some(c=>String(c??"").trim()!==""));if(!aoa.length)return;let hi=0,best=0;aoa.slice(0,15).forEach((r,i)=>{const n=r.filter(c=>String(c??"").trim()!==""&&isNaN(parseNum(c)||NaN)).length;if(n>best){best=n;hi=i}});
    const headers=aoa[hi].map((h,i)=>String(h??"").trim()||"Kolom "+(i+1));tables.push({name:nm,headers,rows:aoa.slice(hi+1).map(r=>headers.map((_,i)=>r[i]??""))})};
  if(["xlsx","xls","xlsm","ods","csv","tsv"].includes(ext)){const X=await LIB.xlsx();let wb;
    if(ext==="csv"||ext==="tsv"){const t=await file.text();wb=X.read(t,{type:"string",FS:ext==="tsv"?"\t":undefined,raw:true})}else wb=X.read(await file.arrayBuffer(),{type:"array",cellDates:true});
    wb.SheetNames.forEach(sn=>fromAoA(sn,X.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:""})))}
  else if(ext==="json"){let j=JSON.parse(await file.text());if(!Array.isArray(j))j=j.data||j.rows||j.kunjungan||Object.values(j).find(Array.isArray)||[];const hs=[...new Set(j.flatMap(o=>Object.keys(o||{})))];tables.push({name:"JSON",headers:hs,rows:j.map(o=>hs.map(h=>typeof o[h]==="object"&&o[h]!==null?JSON.stringify(o[h]):o[h]??""))})}
  else if(ext==="md"||ext==="markdown"){const lines=(await file.text()).split(/\r?\n/);let cur=[];const flush=()=>{if(cur.length)fromAoA("Tabel "+(tables.length+1),cur.filter(r=>!r.every(c=>/^:?-{2,}:?$/.test(c.trim()))));cur=[]};lines.forEach(l=>{if(/^\s*\|/.test(l))cur.push(l.trim().replace(/^\||\|$/g,"").split("|").map(c=>c.trim()));else flush()});flush()}
  else if(ext==="html"||ext==="htm"){htmlTables(await file.text(),fromAoA)}

document.addEventListener("change",e=>{const el=e.target;if(el.dataset.f){S.f[el.dataset.f]=el.value;if(el.dataset.f==="rs")S.f.dpjp="";S.ptPage=1;render()}});
let qT;document.addEventListener("input",e=>{const el=e.target;if(el.dataset.fq!==undefined){clearTimeout(qT);qT=setTimeout(()=>{S.f.q=el.value;S.ptPage=1;const pos=el.selectionStart;render();const n=$("[data-fq]");if(n){n.focus();n.setSelectionRange(pos,pos)}},250)}
  if(el.dataset.mq!==undefined){clearTimeout(qT);qT=setTimeout(()=>{S.ms.q=el.value;S.ms.page=1;const pos=el.selectionStart;render();const n=$("[data-mq]");if(n){n.focus();n.setSelectionRange(pos,pos)}},250)}});

/* ---------------- FILTER BAR ---------------- */
function filterBar(opts={}){const f=S.f;const pens=rows("asuransi");
  const docs=rows("dokter").filter(d=>isSA()?(!f.rs||d.hospitalId===f.rs):d.hospitalId===myRS());
  const r=(v,l)=>`<button class="chip" data-act="range" data-v="${v}">${l}</button>`;
  return `<div class="card"><div class="card-b" style="display:grid;gap:12px"><div class="filters">
   ${isSA()?`<div class="field"><label for="f-rs">Rumah sakit</label><select id="f-rs" class="inp" data-f="rs"><option value="">Semua RS (${DATA.hospitals.length})</option>${DATA.hospitals.map(h=>`<option value="${h.id}" ${f.rs===h.id?"selected":""}>${esc(h.nama)}</option>`).join("")}</select></div>`:""}
   <div class="field"><label for="f-basis">Basis tanggal</label><select id="f-basis" class="inp" data-f="basis"><option value="masuk" ${f.basis==="masuk"?"selected":""}>Tanggal masuk</option><option value="pulang" ${f.basis==="pulang"?"selected":""}>Tanggal pulang</option></select></div>
   <div class="field"><label for="f-from">Dari</label><input id="f-from" type="date" class="inp" data-f="from" value="${f.from}"></div>
   <div class="field"><label for="f-to">Sampai</label><input id="f-to" type="date" class="inp" data-f="to" value="${f.to}"></div>
   <div class="field"><label for="f-pen">Penjamin</label><select id="f-pen" class="inp" data-f="penjamin"><option value="">Semua penjamin</option>${pens.map(p=>`<option value="${esc(p.kode)}" ${f.penjamin===p.kode?"selected":""}>${esc(p.nama)}</option>`).join("")}</select></div>
   <div class="field"><label for="f-dpjp">DPJP</label><select id="f-dpjp" class="inp" data-f="dpjp"><option value="">Semua DPJP</option>${[...new Map(docs.map(d=>[d.kode,d])).values()].map(d=>`<option value="${esc(d.kode)}" ${f.dpjp===d.kode?"selected":""}>${esc(d.nama)}</option>`).join("")}</select></div>
   <div class="field"><label for="f-st">Status pagu</label><select id="f-st" class="inp" data-f="status"><option value="">Semua status</option><option value="over" ${f.status==="over"?"selected":""}>Melebihi pagu</option><option value="ok" ${f.status==="ok"?"selected":""}>Dalam pagu</option><option value="nopagu" ${f.status==="nopagu"?"selected":""}>Pagu belum ada</option><option value="dirawat" ${f.status==="dirawat"?"selected":""}>Masih dirawat</option></select></div>
   ${opts.search?`<div class="field" style="max-width:none;flex:2 1 220px"><label for="f-q">Cari pasien</label><input id="f-q" class="inp" data-fq placeholder="Nama, No. RM, No. Reg, ICD-10, DPJP" value="${esc(f.q)}"></div>`:""}
   </div><div class="btns"><span class="hint">Periode cepat:</span><div class="chips">${r("m","Bulan ini")}${r("3m","3 bulan")}${r("y","Tahun ini")}${r("all","Semua")}</div><div style="flex:1"></div><button class="btn sm ghost" data-act="resetf">${ic("x",14)} Reset filter</button></div></div></div>`}

/* ---------------- DASHBOARD ---------------- */
function aggItems(list){const m={};list.filter(a=>a.selisih<0).forEach(a=>{const seen=new Set();a.lines.forEach(l=>{const contrib=l.offcp+Math.max(0,l.qty)+Math.max(0,l.price);if(contrib<=0)return;const k=l.kode;const r=m[k]||(m[k]={kode:k,nama:l.nama,kategori:l.kategori,nilai:0,pasien:0,offcp:0,qty:0,price:0});r.nilai+=contrib;r.offcp+=l.offcp;r.qty+=Math.max(0,l.qty);r.price+=Math.max(0,l.price);if(!seen.has(k)){r.pasien++;seen.add(k)}})});return Object.values(m).sort((a,b)=>b.nilai-a.nilai)}
function aggDPJP(list){return Object.values(groupBy(list,a=>a.p.hospitalId+"|"+a.p.dpjp)).map(g=>{const p=g[0].p;const wp=g.filter(a=>a.status!=="nopagu");return{kode:p.dpjp,nama:dokterName(p.dpjp,p.hospitalId),spesialis:(rows("dokter").find(d=>d.kode===p.dpjp&&d.hospitalId===p.hospitalId)||{}).spesialis||"",rs:hName(p.hospitalId),n:g.length,billing:sum(g,a=>a.billing),pagu:sum(wp,a=>a.pagu),selisih:sum(wp,a=>a.selisih),over:wp.filter(a=>a.selisih<0).length,nOk:wp.length,losAvg:sum(g,a=>a.los)/g.length,losDev:wp.length?sum(wp,a=>a.losDiff)/wp.length:0}}).sort((a,b)=>a.selisih-b.selisih)}
function aggBy(list,keyFn,labelFn){return Object.values(groupBy(list,keyFn)).map(g=>{const wp=g.filter(a=>a.status!=="nopagu");return{key:keyFn(g[0]),label:labelFn(g[0]),n:g.length,billing:sum(g,a=>a.billing),pagu:sum(wp,a=>a.pagu),selisih:sum(wp,a=>a.selisih),over:wp.filter(a=>a.selisih<0).length,nOk:wp.length,los:sum(g,a=>a.los)/g.length,losStd:wp.length?sum(wp,a=>a.losStd)/wp.length:0}}).sort((a,b)=>a.selisih-b.selisih)}
function monthly(list){const m={};list.forEach(a=>{const d=(S.f.basis==="pulang"?a.p.tglPulang:a.p.tglMasuk)||a.p.tglMasuk;const k=d.slice(0,7);const r=m[k]||(m[k]={k,billing:0,pagu:0,selisih:0,n:0,over:0});r.billing+=a.billing;if(a.status!=="nopagu"){r.pagu+=a.pagu;r.selisih+=a.selisih;if(a.selisih<0)r.over++}r.n++});return Object.values(m).sort((a,b)=>a.k<b.k?-1:1)}
function viewDashboard(c){
  const L=filtered();const wp=L.filter(a=>a.status!=="nopagu");const over=wp.filter(a=>a.selisih<0);
  const B=sum(L,a=>a.billing),P=sum(wp,a=>a.pagu),Sel=sum(wp,a=>a.selisih);const losDev=wp.length?sum(wp,a=>a.losDiff)/wp.length:0;
  const dec={los:sum(over,a=>Math.max(0,a.dec.qtyLos)),offcp:sum(over,a=>a.dec.offcp),qty:sum(over,a=>Math.max(0,a.dec.qty)),price:sum(over,a=>Math.max(0,a.dec.price))};
  const items=aggItems(L);const dp=aggDPJP(L);const dx=aggBy(L,a=>a.p.icd10,a=>a.p.icd10+" · "+(icdName(a.p.icd10)||""));const pj=aggBy(L,a=>a.p.penjamin,a=>penjaminName(a.p.penjamin));
  const rsAgg=aggBy(L,a=>a.p.hospitalId,a=>hName(a.p.hospitalId));const mon=monthly(L);
  const sorted=[...wp].sort((a,b)=>b.selisih-a.selisih);const best=sorted.slice(0,10),worst=[...sorted].reverse().slice(0,10);
  const ongoing=L.filter(a=>a.ongoing&&a.status!=="nopagu"&&a.util>=0.8).sort((a,b)=>b.util-a.util);
  const catAgg=KATEGORI.map(k=>({k,actual:sum(wp,a=>a.cat[k].actual),plafon:sum(wp,a=>a.cat[k].plafon)}));
  // insights
  const ins=[];const decArr=[["Perpanjangan LOS",dec.los],["Item di luar Clinical Pathway",dec.offcp],["Utilisasi melebihi standar",dec.qty],["Tarif di atas harga acuan",dec.price]].sort((a,b)=>b[1]-a[1]);
  if(over.length)ins.push(["bad","alert",`<b>${over.length} dari ${wp.length} pasien (${pct(over.length/wp.length,0)})</b> melebihi pagu dengan total kelebihan <b class="num">${rp(-sum(over,a=>a.selisih))}</b>. Penyebab terbesar: <b>${decArr[0][0].toLowerCase()}</b> (${rpS(decArr[0][1])}).`]);
  if(items[0])ins.push(["warn","layers",`Item tarif paling sering mendorong selisih negatif: <b>${esc(items[0].nama)}</b> pada ${items[0].pasien} pasien senilai <b class="num">${rpS(items[0].nilai)}</b>.`]);
  const dpW=dp.filter(d=>d.nOk>=3)[0];if(dpW&&dpW.selisih<0)ins.push(["info","users",`DPJP dengan selisih negatif terbesar: <b>${esc(dpW.nama)}</b> (${esc(dpW.rs)}), ${dpW.over}/${dpW.nOk} pasien melebihi pagu, rata-rata LOS ${losDev>=0?"":""}${dpW.losDev>0?"+":""}${dpW.losDev.toFixed(1).replace(".",",")} hari dari standar.`]);
  const dxW=dx.filter(d=>d.nOk>=3)[0];if(dxW&&dxW.selisih<0)ins.push(["copper","pt",`Diagnosa paling berisiko: <b>${esc(dxW.label)}</b>, ${pct(dxW.over/dxW.nOk,0)} pasien melebihi pagu.`]);
  if(ongoing.length)ins.push(["warn","clock",`<b>${ongoing.length} pasien masih dirawat</b> sudah memakai ≥80% pagu. Lihat daftar peringatan dini di bawah.`]);
  const insColor={bad:["var(--bad-soft)","var(--bad)"],warn:["var(--warn-soft)","var(--warn)"],info:["var(--info-soft)","var(--info)"],copper:["var(--copper-soft)","var(--copper-strong)"]};
  const ptRow=a=>`<tr class="click" data-act="openpt" data-v="${a.p.id}"><td><b>${esc(a.p.nama)}</b><div class="muted">${esc(a.p.noReg)} · ${esc(a.p.icd10)}${isSA()?" · "+esc(hosp(a.p.hospitalId)?.kode||""):""}</div></td><td class="muted">${esc(dokterName(a.p.dpjp,a.p.hospitalId))}</td><td class="r">${selCell(a.selisih)}<div class="muted">${pct(a.util,0)} pagu</div></td></tr>`;
  const maxItem=items[0]?.nilai||1;
  c.innerHTML=`${filterBar()}
  <div class="kpis">
   <div class="kpi"><span class="k-l">Pasien</span><span class="k-v">${nf.format(L.length)}</span><span class="k-s">${L.filter(a=>a.ongoing).length} masih dirawat · ${L.length-wp.length} tanpa pagu</span></div>
   <div class="kpi"><span class="k-l">Total billing</span><span class="k-v" title="${rp(B)}">${rpS(B)}</span><span class="k-s">rata-rata ${rpS(L.length?B/L.length:0)}/pasien</span></div>
   <div class="kpi"><span class="k-l">Total pagu</span><span class="k-v" title="${rp(P)}">${rpS(P)}</span><span class="k-s">utilisasi ${pct(P?sum(wp,a=>a.billing)/P:0)}</span></div>
   <div class="kpi hl"><span class="k-l">Selisih bersih</span><span class="k-v" style="color:${Sel<0?"#F59A8D":"#8EDCB4"}" title="${rp(Sel)}">${Sel>0?"+":""}${rpS(Sel)}</span><span class="k-s">pagu − billing (pasien berpagu)</span></div>
   <div class="kpi"><span class="k-l">Melebihi pagu</span><span class="k-v ${over.length?"neg":""}">${over.length} <small style="font-size:13px">(${pct(wp.length?over.length/wp.length:0,0)})</small></span><span class="k-s">kelebihan ${rpS(-sum(over,a=>a.selisih))}</span></div>
   <div class="kpi"><span class="k-l">Deviasi LOS</span><span class="k-v ${losDev>0.3?"neg":""}">${losDev>0?"+":""}${losDev.toFixed(2).replace(".",",")} hr</span><span class="k-s">rata-rata vs LOS standar CP</span></div>
  </div>
  ${ins.length?`<div class="card"><div class="card-h"><h3>Temuan utama</h3><span class="sub">dibuat otomatis dari data terfilter</span></div><div class="card-b insights">${ins.map(i=>`<div class="insight"><span class="ic" style="background:${insColor[i[0]][0]};color:${insColor[i[0]][1]}">${ic(i[1],16)}</span><p>${i[2]}</p></div>`).join("")}</div></div>`:""}
  <div class="grid g-7-5">
   <div class="card"><div class="card-h"><h3>Tren bulanan billing vs pagu</h3><span class="sub">berdasarkan tanggal ${S.f.basis}</span></div><div class="card-b"><div class="chart-box"><canvas id="ch-trend"></canvas></div></div></div>
   <div class="card"><div class="card-h"><h3>Penyebab pasien melebihi pagu</h3><span class="sub">dekomposisi Rp</span></div><div class="card-b"><div class="chart-box short"><canvas id="ch-cause"></canvas></div><div class="decomp" style="margin-top:12px">${decArr.map((d,i)=>`<div class="decomp-row"><span><span class="legend-dot" style="background:${["#B93A2E","#906DB1","#B27A08","#3B6E8F"][["Perpanjangan LOS","Item di luar Clinical Pathway","Utilisasi melebihi standar","Tarif di atas harga acuan"].indexOf(d[0])]}"></span>${d[0]}</span><span></span><span class="num">${rpS(d[1])}</span></div>`).join("")}</div></div></div>
  </div>
  <div class="grid ${isSA()&&!S.f.rs?"g2":""}">
   ${isSA()&&!S.f.rs?`<div class="card"><div class="card-h"><h3>Selisih per rumah sakit</h3><span class="sub">pagu − billing</span></div><div class="card-b"><div class="chart-box"><canvas id="ch-rs"></canvas></div></div></div>`:""}
   <div class="card"><div class="card-h"><h3>Billing vs plafon per kategori biaya</h3></div><div class="card-b"><div class="chart-box"><canvas id="ch-cat"></canvas></div></div></div>
  </div>
  <div class="grid g2">
   <div class="card"><div class="card-h"><h3>Selisih terbesar</h3><span class="pill good">efisien</span><span class="grow"></span><span class="sub">10 pasien paling hemat terhadap pagu</span></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Pasien</th><th>DPJP</th><th class="r">Selisih</th></tr></thead><tbody>${best.map(ptRow).join("")||`<tr><td colspan="3" class="empty">Belum ada data</td></tr>`}</tbody></table></div></div>
   <div class="card"><div class="card-h"><h3>Selisih terkecil</h3><span class="pill bad">melebihi pagu</span><span class="grow"></span><span class="sub">10 pasien dengan kelebihan biaya terbesar</span></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Pasien</th><th>DPJP</th><th class="r">Selisih</th></tr></thead><tbody>${worst.map(ptRow).join("")||`<tr><td colspan="3" class="empty">Belum ada data</td></tr>`}</tbody></table></div></div>
  </div>
  <div class="card"><div class="card-h"><h3>Item tarif penyebab selisih negatif</h3><span class="sub">akumulasi dari pasien yang melebihi pagu: item di luar CP + kelebihan qty + selisih harga</span></div>
   <div class="grid g-7-5" style="padding:16px"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Item</th><th>Kategori</th><th class="r">Pasien</th><th class="r">Di luar CP</th><th class="r">Kelebihan qty</th><th class="r">Selisih harga</th><th class="r">Total</th></tr></thead><tbody>
   ${items.slice(0,15).map(i=>`<tr><td><b>${esc(i.nama)}</b><div class="muted mono">${esc(i.kode)}</div></td><td>${esc(i.kategori)}</td><td class="r num">${i.pasien}</td><td class="r num">${rpS(i.offcp)}</td><td class="r num">${rpS(i.qty)}</td><td class="r num">${rpS(i.price)}</td><td class="r"><span class="num neg">${rpS(i.nilai)}</span><div class="bar-mini" style="margin-top:4px"><span style="width:${i.nilai/maxItem*100}%;background:var(--bad)"></span></div></td></tr>`).join("")||`<tr><td colspan="7" class="empty"><b>Tidak ada pasien melebihi pagu</b>pada filter ini.</td></tr>`}</tbody></table></div>
   <div class="chart-box tall"><canvas id="ch-items"></canvas></div></div></div>
  <div class="card"><div class="card-h"><h3>Kinerja DPJP</h3><span class="sub">diurutkan dari selisih paling negatif · klik nama untuk memfilter</span></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>DPJP</th>${isSA()?"<th>RS</th>":""}<th class="r">Pasien</th><th class="r">Billing</th><th class="r">Pagu</th><th class="r">Selisih</th><th class="r">% melebihi</th><th class="r">Deviasi LOS</th></tr></thead><tbody>
   ${dp.map(d=>`<tr><td><button class="btn ghost sm" style="padding:0;font-weight:700" data-act="fdpjp" data-v="${esc(d.kode)}">${esc(d.nama)}</button><div class="muted">${esc(d.spesialis)}</div></td>${isSA()?`<td class="muted">${esc(d.rs)}</td>`:""}<td class="r num">${d.n}</td><td class="r num">${rpS(d.billing)}</td><td class="r num">${rpS(d.pagu)}</td><td class="r">${selCell(d.selisih)}</td><td class="r"><span class="pill ${d.nOk&&d.over/d.nOk>=.5?"bad":d.nOk&&d.over/d.nOk>=.25?"warn":"good"}">${pct(d.nOk?d.over/d.nOk:0,0)}</span></td><td class="r num ${d.losDev>0.5?"neg":""}">${d.losDev>0?"+":""}${d.losDev.toFixed(1).replace(".",",")} hr</td></tr>`).join("")||`<tr><td colspan="8" class="empty">Belum ada data</td></tr>`}</tbody></table></div></div>
  <div class="grid g2">
   <div class="card"><div class="card-h"><h3>Analisa per diagnosa (ICD-10)</h3></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Diagnosa</th><th class="r">Pasien</th><th class="r">Selisih</th><th class="r">% lebih</th><th class="r">LOS / std</th></tr></thead><tbody>${dx.map(d=>`<tr><td>${esc(d.label)}</td><td class="r num">${d.n}</td><td class="r">${selCell(d.selisih)}</td><td class="r num">${pct(d.nOk?d.over/d.nOk:0,0)}</td><td class="r num">${d.los.toFixed(1).replace(".",",")} / ${d.losStd.toFixed(1).replace(".",",")}</td></tr>`).join("")}</tbody></table></div></div>
   <div class="card"><div class="card-h"><h3>Analisa per penjamin</h3></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Penjamin</th><th class="r">Pasien</th><th class="r">Billing</th><th class="r">Selisih</th><th class="r">% lebih</th></tr></thead><tbody>${pj.map(d=>`<tr><td>${esc(d.label)}</td><td class="r num">${d.n}</td><td class="r num">${rpS(d.billing)}</td><td class="r">${selCell(d.selisih)}</td><td class="r num">${pct(d.nOk?d.over/d.nOk:0,0)}</td></tr>`).join("")}</tbody></table></div></div>
  </div>
  ${isSA()&&!S.f.rs&&rsAgg.length>1?`<div class="card"><div class="card-h"><h3>Peta panas selisih: RS × kategori biaya</h3><span class="sub">plafon − billing per kategori; merah = melebihi</span></div><div class="tbl-wrap"><table class="tbl heat"><thead><tr><th>Rumah sakit</th>${KATEGORI.map(k=>`<th class="r">${k}</th>`).join("")}<th class="r">Total</th></tr></thead><tbody>${heatRows(wp)}</tbody></table></div></div>`:""}
  <div class="card"><div class="card-h"><h3>Peringatan dini: pasien masih dirawat</h3><span class="pill warn">≥ 80% pagu</span></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Pasien</th>${isSA()?"<th>RS</th>":""}<th>Masuk</th><th class="r">Hari rawat / std</th><th class="r">Billing berjalan</th><th class="r">Pagu</th><th class="r">Utilisasi</th></tr></thead><tbody>${ongoing.map(a=>`<tr class="click" data-act="openpt" data-v="${a.p.id}"><td><b>${esc(a.p.nama)}</b><div class="muted">${esc(a.p.icd10)} · ${esc(dokterName(a.p.dpjp,a.p.hospitalId))}</div></td>${isSA()?`<td class="muted">${esc(hosp(a.p.hospitalId)?.nama||"")}</td>`:""}<td>${fd(a.p.tglMasuk)}</td><td class="r num">${a.los} / ${a.losStd}</td><td class="r num">${rp(a.billing)}</td><td class="r num">${rp(a.pagu)}</td><td class="r"><span class="pill ${a.util>=1?"bad":"warn"}">${pct(a.util,0)}</span></td></tr>`).join("")||`<tr><td colspan="7" class="empty">Tidak ada pasien dirawat yang mendekati pagu.</td></tr>`}</tbody></table></div></div>`;
  ACT.fdpjp=b=>{S.f.dpjp=b.dataset.v;render()};
  const good=css("--good"),bad=css("--bad"),cop=css("--copper"),char=css("--muted"),info=css("--info"),warn=css("--warn");
  chart("ch-trend",{type:"bar",data:{labels:mon.map(m=>BLN[+m.k.slice(5)-1]+" "+m.k.slice(2,4)),datasets:[{label:"Billing",data:mon.map(m=>m.billing),backgroundColor:cop,borderRadius:4,order:2},{label:"Pagu",data:mon.map(m=>m.pagu),backgroundColor:css("--line"),borderRadius:4,order:3},{label:"Selisih",type:"line",data:mon.map(m=>m.selisih),borderColor:bad,backgroundColor:bad,tension:.3,pointRadius:4,order:1}]},options:{scales:{y:{ticks:{callback:moneyTick}}}}});

function shrinkImg(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const s=Math.min(1,160/Math.max(img.width,img.height));const cv=document.createElement("canvas");cv.width=Math.round(img.width*s);cv.height=Math.round(img.height*s);cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);res(cv.toDataURL("image/png"))};img.onerror=rej;img.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}

  <div class="card"><div class="card-h"><h3>Alur data</h3></div><div class="card-b"><ol style="margin:0;padding-left:18px;display:grid;gap:8px;font-size:13.5px"><li><b>SIMRS RS</b> menyiapkan view/API kunjungan rawat inap dan rincian billing harian.</li><li><b>Middleware / bridging</b> mengubah data ke format JSON baku (kanan bawah), memetakan kode tarif, dokter dan penjamin ke master di sistem ini.</li><li><b>Pantau Biaya</b> menerima kiriman, mencocokkan pasien berdasarkan kode RS + No. Registrasi (data lama diperbarui, bukan diduplikasi).</li><li>Analisa pagu, dashboard dan peringatan dini pasien dirawat diperbarui otomatis.</li></ol><div class="note" style="margin-top:12px">Kunci pencocokan yang wajib konsisten: <b>kode RS</b>, <b>No. Registrasi</b>, <b>kode tarif</b> (= Master Tarif), <b>kode dokter</b> (= Master Dokter), <b>kode penjamin</b> (= Master Asuransi), <b>ICD-10</b> (= Master Pagu).</div></div></div></div>
  <div class="grid g2"><div class="card"><div class="card-h"><h3>Format data baku (kontrak SIMRS)</h3><span class="grow"></span><button class="btn sm" data-act="copy" data-src="#schema">${ic("copy",14)} Salin</button><button class="btn sm" data-act="sdl">${ic("down",14)} Unduh .json</button></div><div class="card-b"><pre class="code" id="schema">${esc(JSON.stringify(SIMRS_SCHEMA,null,2))}</pre></div></div>
  <div class="card"><div class="card-h"><h3>Uji kiriman SIMRS</h3><span class="sub">tempel JSON dari vendor untuk validasi & impor</span></div><div class="card-b" style="display:grid;gap:10px"><textarea id="s-json" class="inp mono" style="min-height:250px;font-size:12px" placeholder='{"rs_kode":"...","kunjungan":[...]}'></textarea><div class="btns"><button class="btn" data-act="sval">${ic("check",15)} Validasi</button><button class="btn pri" data-act="simp">${ic("up",15)} Impor ke sistem</button><button class="btn ghost sm" data-act="ssample">Isi contoh</button></div><div id="s-res"></div></div></div></div>`;
  ACT.sdl=()=>saveFile("format_kiriman_simrs.json",JSON.stringify(SIMRS_SCHEMA,null,2),"application/json");
  ACT.ssample=()=>{const s=JSON.parse(JSON.stringify(SIMRS_SCHEMA));const h=DATA.hospitals[0];if(h){s.rs_kode=h.kode;const d=rows("dokter").find(x=>x.hospitalId===h.id);if(d)s.kunjungan[0].dpjp_kode=d.kode}s.kunjungan[0].no_reg="SIM"+Date.now().toString().slice(-6);$("#s-json").value=JSON.stringify(s,null,2)};
  const validate=()=>{let j;try{j=JSON.parse($("#s-json").value)}catch(e){return{err:["JSON tidak valid: "+e.message]}}const err=[],warn=[];const h=DATA.hospitals.find(x=>x.kode===j.rs_kode);if(!h)err.push(`rs_kode "${j.rs_kode}" tidak ada di Daftar RS.`);if(!Array.isArray(j.kunjungan))err.push("Field kunjungan harus berupa array.");
    (j.kunjungan||[]).forEach((k,i)=>{["no_reg","nama","tgl_masuk","icd10_utama"].forEach(f=>{if(!k[f])err.push(`Kunjungan #${i+1}: ${f} kosong.`)});if(h&&k.dpjp_kode&&!rows("dokter").some(d=>d.kode===k.dpjp_kode&&d.hospitalId===h.id))warn.push(`#${i+1}: dokter ${k.dpjp_kode} belum ada di Master Dokter.`);if(k.penjamin_kode&&!rows("asuransi").some(a=>a.kode===k.penjamin_kode))warn.push(`#${i+1}: penjamin ${k.penjamin_kode} belum ada di Master Asuransi.`);if(!rows("pagu").some(p=>norm(p.icd10)===norm(k.icd10_utama)))warn.push(`#${i+1}: belum ada pagu untuk ${k.icd10_utama}.`);(k.billing||[]).forEach(b=>{if(h&&!rows("tarif").some(t=>t.kode===b.kode_tarif&&(t.hospitalId===h.id||t.hospitalId==="ALL")))warn.push(`#${i+1}: kode tarif ${b.kode_tarif} tidak ada di Master Tarif ${h.kode}.`)})});return{j,h,err,warn}};
  const show=r=>{$("#s-res").innerHTML=r.err.length?`<div class="note warn"><b>${r.err.length} kesalahan</b><br>${r.err.map(esc).join("<br>")}</div>`:`<div class="note"><b>Format valid</b>: ${r.j.kunjungan.length} kunjungan, ${sum(r.j.kunjungan,k=>(k.billing||[]).length)} item billing.${r.warn.length?"<br><br><b>Perhatian:</b><br>"+[...new Set(r.warn)].slice(0,12).map(esc).join("<br>"):""}</div>`};
  ACT.sval=()=>show(validate());
  ACT.simp=async()=>{const r=validate();show(r);if(r.err.length)return;if(!(await confirmPwd(`mengimpor ${r.j.kunjungan.length} kunjungan SIMRS`)))return;const ch=[];
    r.j.kunjungan.forEach(k=>{const rec={hospitalId:r.h.id,noReg:k.no_reg,noRM:k.no_rm||"",nama:k.nama,jk:k.jk==="P"?"P":"L",tglLahir:parseDate(k.tgl_lahir),penjamin:k.penjamin_kode||"",kelas:resolveKelas(k.kelas),jenisRawat:k.jenis_rawat||"Rawat Inap",tglMasuk:parseDate(k.tgl_masuk),tglPulang:parseDate(k.tgl_pulang),dpjp:k.dpjp_kode||"",icd10:String(k.icd10_utama).toUpperCase(),icd10Sek:k.icd10_sekunder||[],icd9:k.icd9||[],caraPulang:k.cara_pulang||"",
      items:(k.billing||[]).map(b=>{const t=rows("tarif").find(x=>x.kode===b.kode_tarif&&(x.hospitalId===r.h.id||x.hospitalId==="ALL"));return{kode:b.kode_tarif,nama:b.nama_item||t?.nama||b.kode_tarif,kategori:KATEGORI.includes(b.kategori)?b.kategori:t?.kategori||"Penunjang",qty:+b.qty||1,harga:+b.harga||t?.harga||0}}),source:"simrs",syncedAt:new Date().toISOString()};
      const ex=DATA.patients.find(p=>p.hospitalId===r.h.id&&p.noReg===rec.noReg);if(ex){Object.assign(ex,rec);ch.push(ex)}else{const p={id:uid("pt"),...rec,catatan:"",createdAt:new Date().toISOString(),ts:Date.now()};DATA.patients.push(p);ch.push(p)}});
    await Store.savePatients(ch);invalidate();await audit("Impor SIMRS",`${r.h.kode}: ${ch.length} kunjungan`);render();toast(ch.length+" kunjungan SIMRS diimpor")};
  ACT.scfg=b=>{const h=hosp(b.dataset.v);const x=(DATA.settings.simrs||{})[h.id]||{};const o=openModal({title:"Integrasi SIMRS · "+h.nama,body:`<div class="form-grid"><div class="field"><label for="sc-v">Nama SIMRS / vendor</label><input id="sc-v" class="inp" value="${esc(x.vendor||"")}" placeholder="mis. Tera, SIMRS Khanza, SIMRS GOS"></div><div class="field"><label for="sc-m">Metode integrasi</label><select id="sc-m" class="inp">${["","REST API (push dari SIMRS)","REST API (tarik dari SIMRS)","Bridging database / view","HL7 FHIR","Unggah berkas berkala"].map(m=>`<option ${x.metode===m?"selected":""}>${m}</option>`).join("")}</select></div><div class="field"><label for="sc-j">Jadwal sinkron</label><select id="sc-j" class="inp">${["","Real-time","Setiap jam","Harian 06.00","Saat pasien pulang"].map(m=>`<option ${x.jadwal===m?"selected":""}>${m}</option>`).join("")}</select></div><div class="field"><label for="sc-u">Alamat endpoint / server</label><input id="sc-u" class="inp mono" value="${esc(x.url||"")}" placeholder="https://simrs.rs.local/api"></div><div class="field full"><label for="sc-n">Catatan PIC & pemetaan</label><textarea id="sc-n" class="inp">${esc(x.catatan||"")}</textarea></div></div><div class="note warn">Jangan menyimpan kunci API atau password di sini. Kredensial disimpan di server middleware.</div>`,foot:`<button class="btn" data-close>Batal</button><button class="btn pri" id="sc-s">Simpan</button>`});
    $("#sc-s",o).onclick=async()=>{if(!(await confirmPwd("menyimpan konfigurasi SIMRS")))return;DATA.settings.simrs=DATA.settings.simrs||{};DATA.settings.simrs[h.id]={vendor:$("#sc-v",o).value.trim(),metode:$("#sc-m",o).value,jadwal:$("#sc-j",o).value,url:$("#sc-u",o).value.trim(),catatan:$("#sc-n",o).value.trim()};await Store.saveDoc("settings");await audit("Konfigurasi SIMRS",h.kode);closeModal(o);render();toast("Konfigurasi tersimpan")}}}

/* ---------------- TUTORIAL ---------------- */
const TUT=[
 ["Masuk dan peran akun","<p>Satu halaman masuk untuk semua pengguna. Sistem membedakan tampilan secara otomatis:</p><ul><li><b>Superadmin Korporat</b>: melihat seluruh RS, mengatur RS, akun, master bersama, integrasi SIMRS, dan log aktivitas.</li><li><b>Admin RS</b>: melihat dan mengelola pasien, dokter, tarif dan pagu khusus RS-nya.</li><li><b>Pemantau RS</b>: hanya melihat dashboard, pasien dan laporan RS-nya, tanpa tombol ubah.</li></ul><p>Setiap simpan, ubah dan hapus meminta password akun Anda untuk konfirmasi.</p>"],
 ["Siapkan master data lebih dulu","<ol><li>Buka <b>Master Data</b>. Isi berurutan: Asuransi, ICD-10, ICD-9, Dokter, Tarif RS, lalu Pagu / Plafon.</li><li>Pakai <b>Unggah</b> untuk memasukkan banyak data sekaligus dari Excel, CSV, PDF, Word, Markdown atau JSON. Sistem mencocokkan kolom otomatis; periksa pemetaan sebelum menekan <b>Impor data</b>.</li><li>Pakai <b>Unduh → Templat kosong</b> untuk mendapatkan susunan kolom yang benar.</li><li>Butuh master lain (mis. formularium, paket tindakan)? Superadmin menekan <b>Tambah sub master</b>, mengisi nama jenis dan kolomnya.</li></ol>"],
 ["Menyusun pagu Clinical Pathway","<p>Satu baris pagu = satu diagnosa (ICD-10) untuk satu kelas. Isi:</p><ul><li><b>LOS standar</b> dan <b>plafon total</b>.</li><li><b>Plafon per kategori</b> (Akomodasi, Visite, Tindakan, Laboratorium, Radiologi, Obat, BMHP, Penunjang).</li><li><b>Item Clinical Pathway</b> dengan format <code>KODE:qty@harga</code>. Tambahkan huruf <code>d</code> untuk item per hari, contoh <code>AKM-K2:5d@450000; VIS-SP:5d@175000; RAD-THX:1@200000</code>.</li></ul><p>Tombol <b>Hitung plafon dari item CP</b> mengisi plafon otomatis dengan buffer yang Anda tentukan. Pilih <b>Semua RS (Korporat)</b> agar pagu berlaku untuk seluruh RS, atau pilih RS tertentu untuk pagu khusus. Pagu khusus RS diutamakan.</p>"],
 ["Mendaftarkan pasien","<ol><li>Buka <b>Daftar Pasien → Tambah pasien</b>. Isi identitas, episode perawatan dan koding.</li><li>Di <b>Rincian billing</b>, ketik kode atau nama tarif; harga terisi dari master tarif RS. Tombol <b>Isi dari item Clinical Pathway</b> mengisi item standar, lalu Anda menyesuaikan qty dengan pemakaian riil.</li><li>Kotak informasi pagu menunjukkan selisih saat itu juga.</li><li>Untuk data banyak, gunakan <b>Unggah pasien</b> lalu <b>Unggah rincian billing</b> (dicocokkan lewat No. Registrasi).</li></ol>"],
 ["Membaca monitoring per pasien","<p>Klik baris pasien di mana pun (daftar pasien, dashboard) untuk membuka <b>tab baru</b> di bagian atas. Tab memuat:</p><ul><li>Status, utilisasi pagu dan selisih.</li><li><b>Analisa penyebab</b>: perpanjangan LOS, item di luar CP, utilisasi melebihi standar, dan tarif RS di atas harga acuan, masing-masing dalam Rupiah.</li><li><b>Rekonsiliasi pagu</b>: dari biaya standar CP sampai total billing.</li><li>Tabel item vs CP dan grafik per kategori.</li></ul><p>Tab bisa dibuka beberapa sekaligus dan ditutup dengan tanda ×.</p>"],
 ["Memakai dashboard","<ul><li>Saring berdasarkan RS, <b>tanggal masuk atau tanggal pulang</b>, periode, penjamin, DPJP dan status.</li><li><b>Temuan utama</b> merangkum masalah terbesar secara otomatis.</li><li>Lihat <b>selisih terbesar dan terkecil</b>, <b>kinerja DPJP</b>, <b>item tarif penyebab selisih negatif</b>, analisa per diagnosa dan penjamin, peta panas RS × kategori, serta <b>peringatan dini</b> pasien yang masih dirawat dan sudah memakai ≥80% pagu.</li></ul>"],
 ["Mengunduh laporan","<p>Menu <b>Laporan</b> menyediakan 10+ laporan siap pakai yang mengikuti filter aktif. Setiap laporan bisa diunduh sebagai Excel, CSV atau PDF, atau dilihat dulu. <b>Paket lengkap</b> menggabungkan semua laporan menjadi satu berkas Excel multi-sheet untuk rapat korporat.</p>"],
 ["Menghubungkan ke SIMRS","<p>Superadmin membuka <b>Integrasi SIMRS</b>, mengatur vendor dan metode tiap RS, lalu menyerahkan <b>format data baku</b> (JSON) ke vendor SIMRS. Kiriman bisa diuji dengan menempelkan JSON di kotak <b>Uji kiriman SIMRS</b>: sistem memeriksa kode RS, dokter, penjamin, tarif dan pagu yang belum cocok sebelum diimpor.</p>"]];
function viewTutorial(c){c.innerHTML=`<div class="page-head"><div><h2>Tutorial Penggunaan</h2><p>Panduan langkah demi langkah dari penyiapan master sampai laporan korporat.</p></div></div><div class="tut">${TUT.map((t,i)=>`<details ${i===0?"open":""}><summary><span class="step">${i+1}</span>${t[0]}</summary><div class="tb">${t[1]}</div></details>`).join("")}</div>
 <div class="card"><div class="card-h"><h3>Istilah</h3></div><div class="card-b"><dl class="kv"><dt>Selisih</dt><dd>Pagu − total billing. Positif berarti biaya masih di bawah pagu; negatif berarti melebihi pagu.</dd><dt>Utilisasi pagu</dt><dd>Total billing ÷ pagu. 90–100% ditandai mendekati pagu.</dd><dt>LOS</dt><dd>Lama rawat (hari) dari tanggal masuk sampai pulang; untuk pasien dirawat dihitung sampai hari ini.</dd><dt>Item di luar CP</dt><dd>Item billing yang tidak tercantum dalam daftar item Clinical Pathway pagu.</dd><dt>Harga acuan</dt><dd>Harga satuan pada item CP pagu; dibandingkan dengan tarif riil RS.</dd><dt>Buffer pagu</dt><dd>Selisih antara plafon total dan biaya standar CP.</dd></dl></div></div>`}

boot();
